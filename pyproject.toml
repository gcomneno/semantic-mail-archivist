[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-mail-archivist"
version = "0.0.0"
description = "Repair, classify and preserve an existing email knowledge base."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
semantic-mail-archivist = "semantic_mail_archivist.cli:main"

[project.optional-dependencies]
gmail = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
